# Render blueprint for the derm//os API (Docker image from backend/Dockerfile). See docs/DEPLOY.md.
# Secrets use `sync: false`: Render asks for them in the dashboard; values never live in git.
services:
  - type: web
    name: dermos-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # Public demo: replay prepared scans, spend no units. Live scans also need the passcode below.
      - key: DEMO_MODE
        value: "1"
      # A fresh (ephemeral) database starts with the demo persona's routine.
      - key: DERMOS_SEED
        value: "1"
      # SQLite and saved masks live on the instance disk; both reset on every restart or redeploy.
      - key: DERMOS_DB
        value: /tmp/dermos.db
      - key: DERMOS_MEDIA
        value: /tmp/dermos-media
      # Render's proxy appends the client IP to X-Forwarded-For; the rate limit reads that hop.
      - key: TRUST_PROXY
        value: "1"
      - key: SCAN_RATE_LIMIT
        value: "30/600"
      # Live scans: refuse when the balance minus the scan would drop below this.
      - key: YOUCAM_UNIT_RESERVE
        value: "200"
      # Live judge scans stop at these unit totals (counted in the database), then replay prepared data.
      - key: JUDGE_UNIT_CAP_TOTAL
        value: "300"
      - key: JUDGE_UNIT_CAP_DAILY
        value: "100"
      - key: LLM_PROVIDER
        value: none
      # Skin Tone face-angle check: the most lenient documented level, so a slightly turned
      # selfie is still read (app/youcam.py tone_strictness). One of flexible|low|medium|high|strict.
      - key: YOUCAM_FACE_ANGLE_STRICTNESS
        value: flexible
      # Set in the dashboard: your Vercel URL, e.g. https://<project>.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Only for a live judge session (with DEMO_MODE=0).
      - key: YOUCAM_API_KEY
        sync: false
      - key: LIVE_SCAN_PASSCODE
        sync: false
      # The real cap for live scans (survives restarts): your balance at deploy time minus the units
      # you'll allow judges. Unset, it falls back to YOUCAM_UNIT_RESERVE.
      - key: LIVE_SCAN_MIN_BALANCE
        sync: false
