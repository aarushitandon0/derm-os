name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests, benchmark, claim linter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DERMOS_NO_DOTENV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Tests (no network, no YouCam units)
        run: python -m pytest -q
      - name: Evidence benchmark
        run: python -m benchmark
      - name: Claim linter
        run: python scripts/claim_lint.py

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Build
        run: npx vite build
